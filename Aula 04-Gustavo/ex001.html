<!DOCTYPE html>
<html lang="pt-br"> <!-- Linguagem do site -->
<head> <!-- Área da Cabeça -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro site</title> <!-- Título do meu site -->
    <style>
        body{
            background-color: rgb(192, 124, 255);
            color: white;
            font: normal 15pt Arial; 
        }
        h1{
            color: black;
        }
    </style> <!-- Essa parte do body, é onde eu vou estilizar
    meu site, ou como podemos dizer de CSS. Style>Body>
    Background, Color, Font, etc. -->
</head>
<body> <!-- Área do Corpo -->
    <h1>Olá, Mundo!</h1>
    <p>Já me livrei da maldição!</p>
    <script>   
        window.alert('Minha primeira mensagem!!')
        window.confirm('Está gostando de Java Script?')
        window.prompt('Qual é seu nome?')
        window.alert('Seja muito Bem-Vindo!')
    </script>
</body>
</html>

<!-- Para começar um título no "body", tenho que começar
 com <h1> e terminar com </h1>. Tudo que estiver escrito
 dentro desses comandos, vai virar um título no meu site.
 
 Para criar um parágrafo, tenho que começar com <p> e
 terminar com </p>-->

 <!-- O "<script>" vai ser para podermos escrever nossos
    códigos em JavaScript. Normalmente, elas são abaixos
    do parágrafo e do título. -->
